<a href="{% url 'catalog:mock_detail' pack.pk %}" class="block rounded-2xl border border-slate-200 bg-white p-5 shadow-sm hover:border-brand" data-testid="pack-card">
  <div class="flex items-start justify-between gap-3">
    <h3 class="font-semibold">{{ pack.title }}</h3>
    {% if pack.is_free %}<span class="rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-semibold text-emerald-800">Free</span>
    {% elif pack.locked %}<span class="rounded-full bg-slate-200 px-2 py-0.5 text-xs font-semibold text-slate-700">🔒 Locked</span>
    {% else %}<span class="rounded-full bg-brand/10 px-2 py-0.5 text-xs font-semibold text-brand">Unlocked</span>{% endif %}
  </div>
  <p class="mt-2 text-sm text-slate-600">{{ pack.item_count }} questions · {% widthratio pack.duration_sec 60 1 %} min</p>
</a>
