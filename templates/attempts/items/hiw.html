<p class="rounded-2xl border border-slate-200 bg-white p-5 leading-10">{% for w in item.words %}<label class="cursor-pointer"><input type="checkbox" name="selected" value="{{ w.i }}" class="peer sr-only" data-multi{% if w.checked %} checked{% endif %}><span class="rounded px-0.5 transition hover:bg-slate-100 peer-checked:bg-amber-300 peer-checked:text-ink">{{ w.w }}</span></label> {% endfor %}</p>
<p class="text-xs text-slate-500">Click the words that differ from the recording. Click again to undo.</p>
