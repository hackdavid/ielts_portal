<p class="leading-9">{% for p in item.parts %}{% if p.blank %}{% with q=p.blank %}{% if q.options %}<select name="{{ q.key }}" class="mx-1 rounded border border-slate-300 px-2 py-1" aria-label="Blank {{ q.key }}"><option value="">—</option>{% for o in q.options %}<option value="{{ o.value }}"{% if o.checked %} selected{% endif %}>{{ o.label }}</option>{% endfor %}</select>{% else %}<input type="text" name="{{ q.key }}" value="{{ q.value }}" class="mx-1 w-32 rounded border border-slate-300 px-2 py-1" aria-label="Blank {{ q.key }}">{% endif %}{% endwith %}{% else %}{{ p.text }}{% endif %}{% endfor %}</p>
{% if item.word_limit %}<p class="text-xs text-slate-500">Max {{ item.word_limit }} word{{ item.word_limit|pluralize }} per blank.</p>{% endif %}
