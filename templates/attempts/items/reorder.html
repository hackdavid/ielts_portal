<div class="space-y-2" data-reorder>
  <input type="hidden" name="order" data-json>
  <p class="text-xs font-semibold tracking-wide text-slate-500 uppercase">Use the arrows to put the paragraphs in order</p>
  {% for p in item.paragraphs %}
  <div class="flex items-start gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition" data-id="{{ p.id }}">
    <div class="flex flex-col gap-1">
      <button type="button" class="grid h-7 w-7 place-items-center rounded-lg border border-slate-200 text-slate-500 hover:border-brand hover:text-brand" @click="reorder($el, -1)" aria-label="Move up">▲</button>
      <button type="button" class="grid h-7 w-7 place-items-center rounded-lg border border-slate-200 text-slate-500 hover:border-brand hover:text-brand" @click="reorder($el, 1)" aria-label="Move down">▼</button>
    </div>
    <p class="flex-1 leading-relaxed">{{ p.text }}</p>
  </div>
  {% endfor %}
</div>
