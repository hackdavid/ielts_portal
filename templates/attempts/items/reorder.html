<div x-data="{ order: {{ item.paragraphs|length }} }" class="space-y-2" data-reorder>
  <input type="hidden" name="order" data-json>
  {% for p in item.paragraphs %}
  <div class="flex items-start gap-3 rounded-lg border border-slate-200 bg-white p-3" data-id="{{ p.id }}">
    <div class="flex flex-col gap-1">
      <button type="button" class="rounded border px-2 text-xs" @click="reorder($el, -1)" aria-label="Move up">▲</button>
      <button type="button" class="rounded border px-2 text-xs" @click="reorder($el, 1)" aria-label="Move down">▼</button>
    </div>
    <p class="flex-1 text-sm">{{ p.text }}</p>
  </div>
  {% endfor %}
</div>
