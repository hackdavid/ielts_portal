<div x-data="listening({ attempt: '{{ attempt.pk }}', order: {{ item.order }}, src: '{{ item.audio }}', maxPlays: {{ listening.max_plays|default:0 }}, allowSeek: {{ listening.allow_seek|yesno:'true,false' }} })"
     class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm" data-testid="audio-player">
  <audio x-ref="audio" preload="auto" :controls="allowSeek" @ended="playing = false" @timeupdate="tick()" @loadedmetadata="tick()" class="w-full" x-show="allowSeek"></audio>
  <div x-show="!allowSeek" class="flex items-center gap-4">
    <button type="button" class="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-ink text-white shadow-lg transition hover:scale-105 disabled:scale-100 disabled:opacity-40" :disabled="playing || exhausted" @click="play()" data-testid="play-audio" :aria-label="playing ? 'Playing' : exhausted ? 'No plays left' : 'Play recording'">{% include "components/icon.html" with name="play" cls="h-5 w-5" %}</button>
    <div class="min-w-0 flex-1">
      <div class="flex items-center justify-between text-xs"><span class="font-semibold text-ink" x-text="playing ? 'Playing…' : exhausted ? 'No plays left' : 'Play recording'"></span><span class="font-mono tabular-nums text-slate-500" x-text="timeText"></span></div>
      <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-200"><div class="h-full rounded-full bg-gradient-to-r from-aurora-1 to-aurora-3" :style="`width:${progress}%`"></div></div>
    </div>
    <label class="hidden items-center gap-2 text-slate-500 sm:flex">{% include "components/icon.html" with name="headphones" cls="h-4 w-4" %}<input type="range" min="0" max="1" step="0.05" value="1" class="w-20 accent-[var(--brand)]" @input="$refs.audio.volume = $event.target.value" aria-label="Volume"></label>
  </div>
  <p class="mt-2 text-xs text-slate-500" x-show="note" x-text="note"></p>
</div>
