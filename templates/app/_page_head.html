{# Usage: include with eyebrow= title= lead= #}
<div data-animate class="mb-8">
  {% if eyebrow %}<p class="eyebrow">{{ eyebrow }}</p>{% endif %}
  <h1 class="mt-2 font-display text-3xl font-extrabold tracking-tight text-ink sm:text-4xl">{{ title }}</h1>
  {% if lead %}<p class="mt-2 max-w-2xl text-slate-600">{{ lead }}</p>{% endif %}
</div>
