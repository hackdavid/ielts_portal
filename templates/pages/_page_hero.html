<section class="px-3 pt-3 sm:px-4 sm:pt-4">
  <div class="relative isolate overflow-hidden rounded-[2rem] bg-aurora px-6 pt-16 pb-20 text-white sm:px-10 lg:pt-20 lg:pb-24">
    <div class="pointer-events-none absolute inset-0 -z-10 bg-grid"></div>
    <div class="mx-auto max-w-3xl text-center">
      <p data-animate class="text-xs font-semibold tracking-[0.18em] text-aurora-3 uppercase">{{ eyebrow }}</p>
      <h1 data-animate class="mt-4 text-4xl leading-tight font-extrabold sm:text-6xl">{{ title|safe }}</h1>
      <p data-animate class="mx-auto mt-5 max-w-2xl text-lg text-slate-300">{{ lead }}</p>
    </div>
  </div>
</section>
