[project]
name = "ielts-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
]

[dependency-groups]
dev = [
    "pytailwindcss>=0.3.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["E501"]
