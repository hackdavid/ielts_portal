[project]
name = "ielts-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-storages[s3]>=1.14.6,<2",
    "firebase-admin>=7.1,<8",
    "matplotlib>=3.11.1,<4",
    "openai-agents>=0.22.0,<0.23",
    "piper-tts>=1.7.0,<2",
    "pypdf>=6.16.2,<7",
    "python-docx>=1.2.0,<2",
]

[dependency-groups]
dev = [
    "pytailwindcss>=0.3.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["E501"]
"catalog/ielts_content/*.py" = ["E501"]
